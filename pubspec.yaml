# Workspace root for cucumber-dart. Not published.
# See docs/design.md (§3.1) and docs/decisions/0005-monorepo-and-in-repo-ports.md.
name: cucumber_workspace
publish_to: none

environment:
  sdk: ^3.8.0

workspace:
  - packages/cucumber_core
  - packages/cucumber
  - packages/cucumber/example
  - packages/cucumber/fixtures/cck
  - packages/cucumber/fixtures/e2e
  - packages/cucumber/fixtures/merge
  - packages/cucumber_compatibility_kit
  - packages/cucumber_ci_environment
  - packages/cucumber_query
  - packages/cucumber_html_formatter

dev_dependencies:
  lints: ^6.0.0
