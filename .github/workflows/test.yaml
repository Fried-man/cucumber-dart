name: test

permissions: {}

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        # Minimum supported SDK (cucumber_gherkin requires ^3.8.0) and latest.
        dart: ["3.8.0", "3.12.0"]
        include:
          - os: windows-latest
            dart: "3.12.0"
          - os: macos-latest
            dart: "3.12.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.dart }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        shell: bash
        run: |
          status=0
          for package in packages/*/; do
            if [ -d "${package}test" ]; then
              echo "::group::${package}"
              (cd "${package}" && dart test) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  compatibility-kit-samples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Verify samples match the pinned compatibility kit
        working-directory: packages/cucumber_compatibility_kit
        run: dart run tool/sync.dart --check

  ported-library-testdata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Verify cucumber_ci_environment matches pinned cucumber/ci-environment
        working-directory: packages/cucumber_ci_environment
        run: dart run tool/sync.dart --check

      - name: Verify cucumber_query matches pinned cucumber/query
        working-directory: packages/cucumber_query
        run: dart run tool/sync.dart --check

      - name: Verify cucumber_html_formatter matches pinned @cucumber/html-formatter
        working-directory: packages/cucumber_html_formatter
        run: dart run tool/sync.dart --check

  # `dart pub publish --dry-run` for every package that no unpublished
  # dependency blocks (docs/design.md §14.1); warnings fail the job.
  # cucumber_core can be published from this repository. The ports keep
  # `publish_to: none` (ADR-0005) and are checked so that they stay ready to be
  # published upstream. `cucumber` is left out: in the workspace its dry run
  # resolves its unpublished dependencies, but pub.dev rejects uploads whose
  # dependencies do not exist.
  publish-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - cucumber_core
          - cucumber_ci_environment
          - cucumber_compatibility_kit
          - cucumber_html_formatter
          - cucumber_query
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Dry-run publish ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: dart pub publish --dry-run

  # `dart doc` for every package. dartdoc exits successfully on warnings
  # (unresolved or ambiguous doc references, broken links, ...), so the job
  # fails unless its summary line reports none. --validate-links also checks
  # the links of the package page rendered from the README. dartdoc no longer
  # reports missing library docs, so a separate step requires a library doc
  # comment with a Dart example in every public library.
  api-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - cucumber
          - cucumber_ci_environment
          - cucumber_compatibility_kit
          - cucumber_core
          - cucumber_html_formatter
          - cucumber_query
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Check library docs of ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          status=0
          for library in lib/*.dart; do
            docs=$(sed -n '/^library;/q;p' "$library")
            if ! grep -q '^library;' "$library" ||
              ! grep -q '^///' <<<"$docs" ||
              ! grep -q '^/// ```dart' <<<"$docs"; then
              echo "::error file=packages/$PACKAGE/$library::needs a library doc comment with a Dart example before 'library;'"
              status=1
            fi
          done
          exit $status

      - name: Generate API docs for ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        shell: bash
        run: |
          dart doc --validate-links --output "$RUNNER_TEMP/api" 2>&1 | tee "$RUNNER_TEMP/dart-doc.log"
          grep -q '^Found 0 warnings and 0 errors\.$' "$RUNNER_TEMP/dart-doc.log"
