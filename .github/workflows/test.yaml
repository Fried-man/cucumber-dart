name: test

permissions: {}

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        # Minimum supported SDK (cucumber_gherkin requires ^3.8.0) and latest.
        dart: ["3.8.0", "3.12.0"]
        include:
          - os: windows-latest
            dart: "3.12.0"
          - os: macos-latest
            dart: "3.12.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.dart }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        shell: bash
        run: |
          status=0
          for package in packages/*/; do
            if [ -d "${package}test" ]; then
              echo "::group::${package}"
              (cd "${package}" && dart test) || status=1
              echo "::endgroup::"
            fi
          done
          exit $status

  compatibility-kit-samples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.12.0"

      - name: Install dependencies
        run: dart pub get

      - name: Verify samples match the pinned compatibility kit
        working-directory: packages/cucumber_compatibility_kit
        run: dart run tool/sync.dart --check
