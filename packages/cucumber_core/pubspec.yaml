name: cucumber_core
description: >-
  Runner-agnostic Cucumber engine for Dart: the glue API (steps, hooks,
  parameter types, World) and an engine that runs Gherkin and emits Cucumber
  Messages.
version: 0.0.1
repository: https://github.com/Fried-man/cucumber-dart/tree/main/packages/cucumber_core
issue_tracker: https://github.com/Fried-man/cucumber-dart/issues
# Publishable: every dependency is on pub.dev. The dev dependency on the
# unpublished cucumber_compatibility_kit only affects running this package's
# own tests outside the workspace (docs/design.md §14.1).
topics: [cucumber, bdd, gherkin, testing]

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  cucumber_expressions: ^20.1.0
  cucumber_gherkin: ^42.0.1
  cucumber_messages: ^34.2.1
  meta: ^1.15.0
  stack_trace: ^1.12.0

dev_dependencies:
  cucumber_compatibility_kit: ^31.0.0
  test: ^1.31.0
  yaml: ^3.1.0
