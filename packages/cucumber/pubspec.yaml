name: cucumber
description: >-
  Cucumber for Dart: run Gherkin features as dart test tests with Cucumber
  Expressions, hooks, typed data tables and Cucumber Messages reports.
version: 0.0.1
repository: https://github.com/Fried-man/cucumber-dart
issue_tracker: https://github.com/Fried-man/cucumber-dart/issues
# Not publishable until its workspace dependencies are published (ADR-0005).
publish_to: none

topics:
  - cucumber
  - bdd
  - gherkin
  - testing

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  cucumber_ci_environment: ^15.0.0
  cucumber_core: ^0.0.1
  cucumber_html_formatter: ^24.2.0
  cucumber_messages: ^34.2.1
  cucumber_query: ^16.1.1
  glob: ^2.1.0
  path: ^1.9.0
  stack_trace: ^1.12.0
  test: ^1.31.0
  yaml: ^3.1.0

dev_dependencies:
  cucumber_compatibility_kit: ^31.0.0
