name: cucumber
description: >-
  Cucumber for Dart: run Gherkin features as dart test tests with Cucumber
  Expressions, hooks, typed data tables and Cucumber Messages reports.
version: 0.0.1
repository: https://github.com/Fried-man/cucumber-dart
issue_tracker: https://github.com/Fried-man/cucumber-dart/issues
# Not publishable until its workspace dependencies are published (ADR-0005).
publish_to: none

topics:
  - cucumber
  - bdd
  - gherkin
  - testing

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  cucumber_core: ^0.0.1
  test: ^1.31.0
