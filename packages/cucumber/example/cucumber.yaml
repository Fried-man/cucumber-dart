# Cucumber configuration (design §4.9). Profiles are selected with
# CUCUMBER_PROFILE; `default` applies when none is named.
default:
  tags: not @wip
  plugins:
    - message:build/cucumber/messages.ndjson
    - html:build/cucumber/report.html
    - summary

wip:
  tags: '@wip'
  plugins:
    - message:build/cucumber/wip.ndjson
