name: cucumber_guide
description: >-
  The project behind the reference pages of docs/guide/. Their code blocks are
  excerpts of these files, and test/docs_test.dart in package:cucumber runs
  their commands here.
publish_to: none

environment:
  sdk: ^3.8.0

resolution: workspace

dev_dependencies:
  cucumber: ^0.0.1
  cucumber_messages: ^34.2.1
  test: ^1.31.0
