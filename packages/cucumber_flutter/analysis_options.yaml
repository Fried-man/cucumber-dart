# The repository's rules (../../analysis_options.yaml), which exclude this
# package because it is outside the pub workspace and needs `flutter pub get`
# (docs/decisions/0021-flutter-widget-test-host.md). Keep the two in step.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - public_member_api_docs
    - sort_pub_dependencies
    - unawaited_futures
