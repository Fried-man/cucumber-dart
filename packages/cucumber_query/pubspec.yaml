name: cucumber_query
description: >-
  Given one Cucumber Message, find another: indexes a stream of Cucumber
  Messages and answers questions about it. A Dart port of cucumber/query.
# Follows the API of the upstream cucumber/query release; the test data synced
# by tool/sync.dart is pinned there.
version: 16.1.1
repository: https://github.com/Fried-man/cucumber-dart/tree/main/packages/cucumber_query
issue_tracker: https://github.com/Fried-man/cucumber-dart/issues
# In-repo port of cucumber/query; publish upstream instead (ADR-0005).
publish_to: none
topics: [cucumber]

environment:
  sdk: ^3.8.0

resolution: workspace

dependencies:
  cucumber_messages: ^34.2.1

dev_dependencies:
  crypto: ^3.0.6
  test: ^1.31.0
